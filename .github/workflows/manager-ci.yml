name: NanoPi Manager CI

on:
  push:
    paths:
      - "manager/**"
      - "scripts/install-manager.sh"
      - "scripts/uninstall-manager.sh"
      - ".github/workflows/manager-ci.yml"
  pull_request:
    paths:
      - "manager/**"
      - "scripts/install-manager.sh"
      - "scripts/uninstall-manager.sh"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: manager/go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Cross-compile ARM64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -o /tmp/nanopi-manager-web ./cmd/nanopi-manager-web
          go build -trimpath -o /tmp/nanopi-manager-agent ./cmd/nanopi-manager-agent
      - name: Check shell syntax
        working-directory: .
        run: bash -n scripts/00-remove-legacy-second-layer.sh scripts/install-manager.sh scripts/uninstall-manager.sh

