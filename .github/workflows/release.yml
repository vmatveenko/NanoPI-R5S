name: NanoPi Manager Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: manager/go.mod
      - name: Test
        working-directory: manager
        run: go test ./...
      - name: Build release archives
        working-directory: manager
        run: |
          set -euo pipefail
          version_ldflags="-s -w -X github.com/vmatveenko/nanopi-r5s/manager/internal/buildinfo.Version=${GITHUB_REF_NAME}"
          for arch in arm64 amd64; do
            mkdir -p "dist/linux-${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="$version_ldflags" -o "dist/linux-${arch}/nanopi-manager-web" ./cmd/nanopi-manager-web
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="$version_ldflags" -o "dist/linux-${arch}/nanopi-manager-agent" ./cmd/nanopi-manager-agent
            tar -C "dist/linux-${arch}" -czf "dist/nanopi-manager-linux-${arch}.tar.gz" nanopi-manager-web nanopi-manager-agent
          done
          cd dist
          sha256sum nanopi-manager-linux-*.tar.gz > checksums.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "NanoPi Manager $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            manager/dist/nanopi-manager-linux-arm64.tar.gz \
            manager/dist/nanopi-manager-linux-amd64.tar.gz \
            manager/dist/checksums.txt \
            --clobber
